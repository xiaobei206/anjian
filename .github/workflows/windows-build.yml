name: Windows build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-publish:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore Anjian2026.sln
      - name: Build
        run: dotnet build Anjian2026.sln -c Release --no-restore
      - name: Test
        run: dotnet test tests/Anjian.Core.Tests/Anjian.Core.Tests.csproj -c Release --no-build --logger "trx;LogFileName=Anjian-Core.trx"
      - name: Publish portable Windows x64
        run: dotnet publish src/Anjian.App/Anjian.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o artifacts/publish/win-x64
      - name: Package and checksum
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $productVersion = [System.Diagnostics.FileVersionInfo]::GetVersionInfo("artifacts/publish/win-x64/Anjian.App.exe").ProductVersion
          if (-not $productVersion.StartsWith($version)) { throw "ProductVersion mismatch: $productVersion vs $version" }
          $zip = "Anjian2026-$version-win-x64.zip"
          Compress-Archive -Path "artifacts/publish/win-x64/*" -DestinationPath "artifacts/$zip" -CompressionLevel Optimal
          $hash = (Get-FileHash "artifacts/$zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zip" | Set-Content "artifacts/$zip.sha256" -Encoding ascii
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Anjian2026-preview-win-x64
          path: |
            artifacts/Anjian2026-*-win-x64.zip
            artifacts/Anjian2026-*-win-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Read release version
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release:')
        id: release_version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          "version=$version" | Set-Content $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Create GitHub Release
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release:')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.release_version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Anjian2026 v${{ steps.release_version.outputs.version }}
          prerelease: true
          generate_release_notes: true
          files: |
            artifacts/Anjian2026-*-win-x64.zip
            artifacts/Anjian2026-*-win-x64.zip.sha256
